<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RVN Combo Scanner – Live Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#071228;color:#e6eef6;margin:0;}
  header{background:linear-gradient(90deg,#0f172a,#1e293b);padding:12px;text-align:center;
    box-shadow:0 0 15px rgba(0,255,255,0.15);}
  h1{margin:0;font-size:22px;color:#38bdf8;text-shadow:0 0 8px rgba(56,189,248,0.5);}
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px;}
  nav button{padding:6px 12px;border:none;border-radius:6px;background:#1e293b;color:#e6eef6;cursor:pointer;
    transition:0.3s;box-shadow:0 0 8px rgba(0,255,255,0.1);}
  nav button:hover{background:#334155;box-shadow:0 0 10px rgba(0,255,255,0.3);}
  nav button.active{background:#06b6d4;color:#fff;box-shadow:0 0 12px rgba(6,182,212,0.6);}
  section{display:none;padding:12px;}
  section.active{display:block;}
  h2{margin:10px 0;color:#f0f9ff;text-shadow:0 0 6px rgba(255,255,255,0.2);}
  table{width:100%;border-collapse:collapse;cursor:pointer;}
  th,td{padding:6px;border-bottom:1px dashed #1e293b;font-size:14px;}
  th{color:#94a3b8;}
  .green{color:#22c55e;text-shadow:0 0 6px rgba(34,197,94,0.4);}
  .red{color:#ef4444;text-shadow:0 0 6px rgba(239,68,68,0.4);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0;}
  .tile{background:#1e293b;padding:8px;border-radius:8px;text-align:center;font-size:12px;
    cursor:pointer;transition:0.3s;box-shadow:0 0 8px rgba(255,255,255,0.05);}
  .tile:hover{background:#334155;box-shadow:0 0 12px rgba(0,255,255,0.3);}
  .tile div{margin:2px 0;}
  .tile .val{font-weight:700;font-size:14px;}
  /* Crypto Tiles (bigger) */
  .crypto-row{display:flex;gap:20px;justify-content:center;margin:20px 0;}
  .crypto-tile{background:#1e293b;padding:20px;border-radius:12px;text-align:center;
    width:220px;cursor:pointer;transition:0.3s;box-shadow:0 0 12px rgba(255,255,255,0.08);}
  .crypto-tile:hover{background:#334155;box-shadow:0 0 18px rgba(0,255,255,0.3);}
  .crypto-name{font-size:16px;font-weight:600;color:#38bdf8;margin-bottom:10px;}
  .crypto-price{font-size:20px;font-weight:bold;color:#fff;}
  /* Divider */
  hr{border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;}
</style>
</head>
<body>
<header>
  <h1>RVN Combo Scanner – Live Dashboard</h1>
</header>

<!-- ===== Dashboard Section ===== -->
<div style="padding:12px;">
  <h2>Sector % Change Chart</h2>
  <canvas id="sectorChart" height="100"></canvas>
  <hr>

  <!-- Crypto tiles -->
  <h2>Crypto Prices</h2>
  <div class="crypto-row">
    <div class="crypto-tile" onclick="openTradingView('BINANCE:BTCUSDT')">
      <div class="crypto-name">Bitcoin</div>
      <div class="crypto-price" id="btcPrice">--</div>
    </div>
    <div class="crypto-tile" onclick="openTradingView('BINANCE:ETHUSDT')">
      <div class="crypto-name">Ethereum</div>
      <div class="crypto-price" id="ethPrice">--</div>
    </div>
  </div>
  <hr>

  <h2>Sector Scope</h2>
  <div class="tiles" id="sectorTiles"></div>
  <hr>

  <div style="display:flex;gap:12px;margin-top:12px;">
    <div style="flex:1;">
      <h3>Top Gainers (All Sectors)</h3>
      <table><thead><tr><th>Symbol</th><th>LTP</th><th>%</th></tr></thead><tbody id="topGainers"></tbody></table>
    </div>
    <div style="flex:1;">
      <h3>Top Losers (All Sectors)</h3>
      <table><thead><tr><th>Symbol</th><th>LTP</th><th>%</th></tr></thead><tbody id="topLosers"></tbody></table>
    </div>
  </div>
  <hr>
</div>

<!-- ===== Tabs Section (per-index stocks) ===== -->
<nav id="menu"></nav>
<div id="sections"></div>

<script>
/* ------------ Config ------------- */
const INDICES = {
  "NIFTY 50":{symbol:"^NSEI",tv:"NSE:NIFTY",stocks:["RELIANCE.NS","TCS.NS","HDFCBANK.NS","INFY.NS","ICICIBANK.NS","SBIN.NS"]},
  "BANKNIFTY":{symbol:"^NSEBANK",tv:"NSE:BANKNIFTY",stocks:["HDFCBANK.NS","ICICIBANK.NS","AXISBANK.NS","KOTAKBANK.NS","SBIN.NS"]},
  "NIFTY IT":{symbol:"^CNXIT",tv:"NSE:CNXIT",stocks:["TCS.NS","INFY.NS","WIPRO.NS","HCLTECH.NS","TECHM.NS"]},
  "NIFTY AUTO":{symbol:"^CNXAUTO",tv:"NSE:CNXAUTO",stocks:["MARUTI.NS","M&M.NS","TATAMOTORS.NS","BAJAJ-AUTO.NS","HEROMOTOCO.NS"]},
  "NIFTY FMCG":{symbol:"^CNXFMCG",tv:"NSE:CNXFMCG",stocks:["HINDUNILVR.NS","ITC.NS","NESTLEIND.NS","BRITANNIA.NS","DABUR.NS"]},
  "NIFTY PHARMA":{symbol:"^CNXPHARMA",tv:"NSE:CNXPHARMA",stocks:["SUNPHARMA.NS","DRREDDY.NS","CIPLA.NS","DIVISLAB.NS","LUPIN.NS"]},
  "NIFTY METAL":{symbol:"^CNXMETAL",tv:"NSE:CNXMETAL",stocks:["TATASTEEL.NS","JSWSTEEL.NS","HINDALCO.NS","VEDL.NS","SAIL.NS"]},
  "NIFTY REALTY":{symbol:"^CNXREALTY",tv:"NSE:CNXREALTY",stocks:["DLF.NS","GODREJPROP.NS","OBEROIRLTY.NS","PHOENIXLTD.NS","LODHA.NS"]},
  "NIFTY ENERGY":{symbol:"^CNXENERGY",tv:"NSE:CNXENERGY",stocks:["RELIANCE.NS","ONGC.NS","BPCL.NS","IOC.NS","NTPC.NS"]}
};

/* ------------ State ------------- */
let activeIndex = "NIFTY 50";
let refreshTimer = null;
let chart = null;

/* ------------ Fetch Helper ------------- */
async function fetchYahoo(symbol, interval="1d", range="1d"){
  const url = "https://api.allorigins.win/get?url="+encodeURIComponent(
    `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${interval}&range=${range}`
  );
  const r = await fetch(url);
  const j = await r.json();
  const d = JSON.parse(j.contents||"{}");
  const res = d.chart?.result?.[0];
  if(!res) throw "No data";
  const last = res.meta.regularMarketPrice ?? res.meta.chartPreviousClose;
  const prev = res.meta.chartPreviousClose ?? last;
  return {last, chg: (last-prev)/prev*100};
}

/* ------------ Dashboard Refresh ------------- */
async function refreshDashboard(){
  let data = [];
  let allStocks = [];
  for(const [name,val] of Object.entries(INDICES)){
    try{
      const q = await fetchYahoo(val.symbol);
      data.push({name, chg:q.chg, last:q.last, tv:val.tv});
      for(const s of val.stocks){
        try{
          const d = await fetchYahoo(s);
          allStocks.push({sym:s, last:d.last, chg:d.chg});
        }catch{}
      }
    }catch{
      data.push({name, chg:0, last:0, tv:val.tv});
    }
  }
  // Tiles
  const tiles = document.getElementById("sectorTiles"); tiles.innerHTML="";
  data.forEach(d=>{
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = `<div>${d.name}</div>
                   <div class="val">${d.last?d.last.toFixed(2):"--"}</div>
                   <div class="${d.chg>=0?'green':'red'}">${d.chg.toFixed(2)}%</div>`;
    t.onclick = ()=>window.open(`https://in.tradingview.com/chart/?symbol=${encodeURIComponent(d.tv)}`,"_blank");
    tiles.appendChild(t);
  });

  // Global Gainers/Losers
  allStocks.sort((a,b)=>b.chg-a.chg);
  document.getElementById("topGainers").innerHTML = allStocks.slice(0,5).map(d=>
    `<tr onclick="window.open('https://in.tradingview.com/chart/?symbol=NSE%3A${d.sym.replace('.NS','')}', '_blank')">
      <td>${d.sym.replace('.NS','')}</td><td>${d.last.toFixed(2)}</td>
      <td class="green">${d.chg.toFixed(2)}%</td></tr>`).join("");
  document.getElementById("topLosers").innerHTML = allStocks.slice(-5).map(d=>
    `<tr onclick="window.open('https://in.tradingview.com/chart/?symbol=NSE%3A${d.sym.replace('.NS','')}', '_blank')">
      <td>${d.sym.replace('.NS','')}</td><td>${d.last.toFixed(2)}</td>
      <td class="red">${d.chg.toFixed(2)}%</td></tr>`).join("");
}

/* ------------ Chart Refresh (15s) ------------- */
async function refreshChartOnly(){
  let data = [];
  for(const [name,val] of Object.entries(INDICES)){
    try{
      const q = await fetchYahoo(val.symbol);
      data.push({name, chg:q.chg});
    }catch{
      data.push({name, chg:0});
    }
  }
  const ctx = document.getElementById("sectorChart").getContext("2d");
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    type:"bar",
    data:{
      labels:data.map(x=>x.name),
      datasets:[{
        data:data.map(x=>x.chg),
        backgroundColor:data.map(x=>x.chg>=0?"rgba(34,197,94,0.6)":"rgba(239,68,68,0.6)")
      }]
    },
    options:{plugins:{legend:{display:false}}}
  });
}

/* ------------ Crypto ------------- */
const btcPriceEl = document.getElementById("btcPrice");
const ethPriceEl = document.getElementById("ethPrice");
function openTradingView(symbol){
  window.open(`https://www.tradingview.com/chart/?symbol=${symbol}`,"_blank");
}
async function fetchCrypto(){
  try{
    const btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    btcPriceEl.innerText = `$${parseFloat(btc.price).toFixed(2)}`;
    const eth = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT").then(r=>r.json());
    ethPriceEl.innerText = `$${parseFloat(eth.price).toFixed(2)}`;
  }catch{
    btcPriceEl.innerText = ethPriceEl.innerText = "Error";
  }
}

/* ------------ Tabs (per-index stocks) ------------- */
function buildUI(){
  const menu = document.getElementById("menu");
  const sections = document.getElementById("sections");
  Object.keys(INDICES).forEach((name,i)=>{
    if(INDICES[name].stocks.length===0) return;
    const btn = document.createElement("button");
    btn.innerText = name; if(i===0) btn.classList.add("active");
    btn.onclick = ()=>switchTab(name);
    menu.appendChild(btn);

    const sec = document.createElement("section");
    sec.id = "sec-"+name; if(i===0) sec.classList.add("active");
    sec.innerHTML = `<h2>${name}</h2>
      <table><thead><tr><th>Stock</th><th>Price</th><th>%</th></tr></thead>
      <tbody id="table-${name}"></tbody></table>`;
    sections.appendChild(sec);
  });
}
function switchTab(name){
  activeIndex = name;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  [...document.querySelectorAll("nav button")].forEach(b=>{if(b.innerText===name) b.classList.add("active");});
  if(document.getElementById("sec-"+name)) document.getElementById("sec-"+name).classList.add("active");
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTab(); refreshTimer = setInterval(refreshTab, 2000);
}
async function refreshTab(){
  const name = activeIndex;
  const val  = INDICES[name];
  try{
    let stockData = [];
    for(const s of val.stocks){
      try{
        const d = await fetchYahoo(s);
        stockData.push({sym:s, last:d.last, chg:d.chg});
      }catch{}
    }
    stockData.sort((a,b)=>b.chg-a.chg);

    let rows = "";
    for(const d of stockData){
      rows += `<tr onclick="window.open('https://in.tradingview.com/chart/?symbol=NSE%3A${d.sym.replace('.NS','')}', '_blank')">
        <td>${d.sym.replace(".NS","")}</td>
        <td>${d.last.toFixed(2)}</td>
        <td class="${d.chg>=0?'green':'red'}">${d.chg.toFixed(2)}%</td>
      </tr>`;
    }
    document.getElementById("table-"+name).innerHTML = rows;
  }catch(e){
    console.log(name, "error", e);
  }
}

/* ------------ Start ------------- */
buildUI(); switchTab("NIFTY 50");
setInterval(refreshDashboard, 2000);   // tiles + gainers/losers
setInterval(refreshChartOnly, 15000);  // chart
setInterval(fetchCrypto, 2000);        // BTC/ETH
refreshDashboard(); refreshChartOnly(); fetchCrypto();
  window.onpopstate = function() {
  window.location.href = "/";
};

document.addEventListener("backbutton", function () {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    navigator.app.exitApp();
  }
});
</script>
  
</body>
</html>
